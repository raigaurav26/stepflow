services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: stepflow
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 10

  # `docker compose up --build` runs the whole thing; `docker compose up -d postgres` is
  # enough when running the app from the IDE or with `mvn spring-boot:run`.
  stepflow:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      STEPFLOW_DB_URL: jdbc:postgresql://postgres:5432/stepflow
      STEPFLOW_DB_USER: postgres
      STEPFLOW_DB_PASSWORD: postgres
      STEPFLOW_DEMO_ENABLED: "true"
    ports:
      - "8080:8080"
