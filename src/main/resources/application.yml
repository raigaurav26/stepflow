spring:
  application:
    name: stepflow
  datasource:
    url: ${STEPFLOW_DB_URL:jdbc:postgresql://localhost:5432/stepflow}
    username: ${STEPFLOW_DB_USER:postgres}
    password: ${STEPFLOW_DB_PASSWORD:postgres}
  flyway:
    enabled: true

stepflow:
  worker:
    enabled: ${STEPFLOW_WORKER_ENABLED:true}
    threads: 4
    poll-interval: 500ms
    lease-duration: 30s
    reap-interval: 10s
  scheduler:
    enabled: ${STEPFLOW_SCHEDULER_ENABLED:true}
    poll-interval: 1s
  demo:
    enabled: ${STEPFLOW_DEMO_ENABLED:false}
    cooling-off: 10s
    retry-delay: 1s
    latency: 300ms
  retry:
    initial-delay: 1s
    multiplier: 2.0
    max-delay: 5m
    jitter: 0.2

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    tags:
      application: stepflow
