spring:
  application:
    name: stepflow
  datasource:
    url: ${STEPFLOW_DB_URL:jdbc:postgresql://localhost:5432/stepflow}
    username: ${STEPFLOW_DB_USER:postgres}
    password: ${STEPFLOW_DB_PASSWORD:postgres}
  flyway:
    enabled: true

stepflow:
  worker:
    enabled: ${STEPFLOW_WORKER_ENABLED:true}
    threads: 4
    poll-interval: 500ms
    lease-duration: 30s

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info
